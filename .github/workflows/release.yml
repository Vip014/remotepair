name: Release Host APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.1)'
        required: true

permissions:
  contents: write

jobs:
  release-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses >/dev/null 2>&1 || true
          "$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Host debug APK
        working-directory: host-app
        run: |
          chmod +x gradlew || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi
          ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp host-app/app/build/outputs/apk/debug/app-debug.apk RemotePair-Host.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RemotePair Host ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            RemotePair Host — install on the phone you want to control.
            Download **RemotePair-Host.apk** below.
          files: RemotePair-Host.apk
