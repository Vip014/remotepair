<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RemotePair — Web Controller</title>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #121620;
    --surface-2: #1c212d;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --accent: #3b82f6;
    --accent-2: #2563eb;
    --ok: #22c55e;
    --err: #ef4444;
    --outline: #2a3140;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--outline);
    background: var(--surface);
  }
  header .logo { font-weight: 700; letter-spacing: .5px; }
  header .logo span { color: var(--accent); }
  .pill {
    margin-left: auto;
    font-size: 13px; color: var(--muted);
    background: var(--surface-2);
    padding: 6px 12px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.live { color: #fff; background: var(--accent-2); }
  .pill.err { color: #fff; background: var(--err); }

  /* Connect card */
  .connect {
    margin: auto;
    width: min(420px, 92vw);
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 18px;
    padding: 28px 24px;
    text-align: center;
  }
  .connect h1 { margin: 0 0 4px; font-size: 20px; }
  .connect p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .connect input {
    width: 100%;
    font-size: 26px; letter-spacing: 4px; text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    padding: 14px 10px;
    background: var(--bg);
    border: 1px solid var(--outline);
    border-radius: 12px;
    color: var(--text);
    outline: none;
  }
  .connect input:focus { border-color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border: none;
    border-radius: 12px; padding: 12px 16px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--surface-2); color: var(--text); }
  .connect button { width: 100%; margin-top: 16px; padding: 14px; font-size: 16px; }

  /* Stage */
  .stage {
    flex: 1; min-height: 0;
    display: none;
    flex-direction: column;
    background: #000;
  }
  .stage.active { display: flex; }
  .screen-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  video {
    max-width: 100%; max-height: 100%;
    background: #000;
    touch-action: none;
    cursor: crosshair;
  }
  .overlay-hint {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; text-align: center; padding: 20px;
    pointer-events: none;
  }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--surface-2); border-top-color: var(--accent);
    animation: spin 1s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--surface);
    border-top: 1px solid var(--outline);
  }
  .toolbar button { background: var(--surface-2); color: var(--text); font-weight: 500; padding: 10px 14px; }
  .toolbar button:hover { background: #28303f; }
  .toolbar .spacer { flex: 1; }
  .toolbar .disconnect { background: var(--err); color: #fff; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 14px 10px; background: var(--surface); }

  /* File browser drawer */
  .files-panel {
    position: fixed; top: 0; right: 0; height: 100%; width: min(380px, 90vw);
    background: var(--surface); border-left: 1px solid var(--outline);
    transform: translateX(100%); transition: transform .2s ease;
    display: flex; flex-direction: column; z-index: 50;
  }
  .files-panel.open { transform: translateX(0); }
  .files-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--outline); }
  .files-status { color: var(--muted); font-size: 12px; }
  .files-path { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--outline); }
  .files-pathlabel { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  .files-list li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--outline); cursor: pointer; }
  .files-list li:hover { background: var(--surface-2); }
  .files-list .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files-list .fsize { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <div class="logo">Remote<span>Pair</span> · Web</div>
    <div id="pill" class="pill">Not connected</div>
  </header>

  <!-- Connect screen -->
  <div id="connectCard" class="connect">
    <h1>Connect to a host</h1>
    <p>Enter the 9-digit ID shown in the RemotePair Host app.</p>
    <input id="hostId" inputmode="numeric" maxlength="9" placeholder="123456789" autocomplete="off" />
    <input id="hostPw" type="password" placeholder="Password (if the host set one)" autocomplete="off"
      style="width:100%;margin-top:12px;font-size:16px;text-align:center;padding:12px 10px;background:var(--bg);border:1px solid var(--outline);border-radius:12px;color:var(--text);outline:none;" />
    <button id="connectBtn">Connect</button>
  </div>

  <!-- Live screen -->
  <div id="stage" class="stage">
    <div class="screen-wrap">
      <video id="screen" autoplay playsinline muted></video>
      <div id="hint" class="overlay-hint">
        <div>
          <div class="spinner"></div>
          Waiting for the host screen…<br />
          Make sure the host tapped “Start sharing”.
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button data-nav="back">◀ Back</button>
      <button data-nav="home">● Home</button>
      <button data-nav="recents">■ Recents</button>
      <span class="spacer"></span>
      <button id="filesBtn" class="ghost" disabled>📁 Files</button>
      <button id="fsBtn" class="ghost">⛶ Fullscreen</button>
      <button id="disconnectBtn" class="disconnect">Disconnect</button>
    </div>
    <div class="hint">Click to tap · click-and-drag to swipe. Keep this tab open to stay connected.</div>
  </div>

  <!-- File browser drawer -->
  <div id="filesPanel" class="files-panel">
    <div class="files-head">
      <strong>Files</strong>
      <span id="filesStatus" class="files-status"></span>
      <button id="filesClose" class="ghost" style="margin-left:auto;padding:6px 10px;">✕</button>
    </div>
    <div class="files-path"><button id="filesUp" class="ghost" style="padding:4px 10px;">↑ Up</button>
      <span id="filesPathLabel" class="files-pathlabel"></span></div>
    <ul id="filesList" class="files-list"></ul>
  </div>

<script>
(() => {
  "use strict";

  // Signaling URL: same host as this page, ws(s) scheme.
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
  const ICE = [{ urls: "stun:stun.l.google.com:19302" }];

  const el = (id) => document.getElementById(id);
  const pill = el("pill");
  const connectCard = el("connectCard");
  const stage = el("stage");
  const video = el("screen");
  const hint = el("hint");

  let ws = null, pc = null, dc = null, filesDc = null;
  let hostId = null;
  let hostPassword = "";
  let pingTimer = null;
  // File browser state
  let curPath = "", rootPath = "", recv = null;

  function setPill(text, cls) {
    pill.textContent = text;
    pill.className = "pill" + (cls ? " " + cls : "");
  }

  function wsSend(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function sendSignal(payload) { wsSend({ type: "signal", payload }); }

  function startPing() {
    stopPing();
    pingTimer = setInterval(() => wsSend({ type: "ping" }), 25000);
  }
  function stopPing() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  }

  function start(id) {
    hostId = id;
    setPill("Connecting…");
    if (ws) { try { ws.onclose = null; ws.close(); } catch (_) {} }
    teardownCall();
    ws = new WebSocket(WS_URL);
    ws.onopen = () => { wsSend({ type: "register", role: "controller" }); startPing(); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case "registered":
          setPill("Finding host " + hostId + "…");
          wsSend({ type: "connect", id: hostId, password: hostPassword });
          break;
        case "connected":
          setPill("Negotiating…");
          startCall();
          break;
        case "signal":
          handleSignal(m.payload);
          break;
        case "peer_left":
          setPill("Host left", "err");
          teardownCall();
          break;
        case "error":
          if (m.error === "host_not_found") {
            setPill("Host not online — open the Host app, wait for “Ready”, then Connect again", "err");
          } else if (m.error === "auth_failed") {
            setPill("Wrong password — check with the host and try again", "err");
          } else {
            setPill("Error: " + (m.error || "unknown"), "err");
          }
          break;
      }
    };
    ws.onclose = () => { stopPing(); if (pill.className.indexOf("err") < 0) setPill("Disconnected"); };
    ws.onerror = () => setPill("Connection error", "err");
  }

  async function startCall() {
    pc = new RTCPeerConnection({ iceServers: ICE });
    pc.addTransceiver("video", { direction: "recvonly" });
    dc = pc.createDataChannel("input", { ordered: true, maxRetransmits: 0 });

    // Reliable, ordered channel for file browsing/transfer.
    filesDc = pc.createDataChannel("files", { ordered: true });
    filesDc.binaryType = "arraybuffer";
    filesDc.onopen = () => { el("filesBtn").disabled = false; };
    filesDc.onmessage = onFilesMessage;

    pc.ontrack = (e) => {
      video.srcObject = e.streams[0] || new MediaStream([e.track]);
      hint.style.display = "none";
      setPill("Live", "live");
    };
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        sendSignal({
          candidate: e.candidate.candidate,
          sdpMid: e.candidate.sdpMid,
          sdpMLineIndex: e.candidate.sdpMLineIndex,
        });
      }
    };
    pc.onconnectionstatechange = () => {
      if (pc && (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
        setPill("Connection lost", "err");
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({ type: "offer", sdp: offer.sdp });

    connectCard.style.display = "none";
    stage.classList.add("active");
  }

  async function handleSignal(p) {
    if (!p) return;
    if (p.type === "answer") {
      await pc.setRemoteDescription({ type: "answer", sdp: p.sdp });
    } else if (p.candidate) {
      try {
        await pc.addIceCandidate({
          candidate: p.candidate,
          sdpMid: p.sdpMid,
          sdpMLineIndex: p.sdpMLineIndex,
        });
      } catch (_) {}
    }
  }

  function teardownCall() {
    if (pc) { try { pc.close(); } catch (_) {} pc = null; }
    dc = null; filesDc = null; recv = null;
    video.srcObject = null;
    hint.style.display = "flex";
    const fb = document.getElementById("filesBtn"); if (fb) fb.disabled = true;
    const fp = document.getElementById("filesPanel"); if (fp) fp.classList.remove("open");
  }

  function fullDisconnect() {
    stopPing();
    teardownCall();
    if (ws) { try { wsSend({ type: "disconnect" }); ws.close(); } catch (_) {} ws = null; }
    stage.classList.remove("active");
    connectCard.style.display = "";
    setPill("Not connected");
  }

  function sendInput(obj) {
    if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj));
  }

  // Map a pointer position on the <video> element to normalized [0,1]
  // coordinates inside the actual video frame (accounts for letterboxing).
  function normFromEvent(e) {
    const r = video.getBoundingClientRect();
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const scale = Math.min(r.width / vw, r.height / vh);
    const dispW = vw * scale, dispH = vh * scale;
    const offX = (r.width - dispW) / 2, offY = (r.height - dispH) / 2;
    const x = (e.clientX - r.left - offX) / dispW;
    const y = (e.clientY - r.top - offY) / dispH;
    if (x < 0 || x > 1 || y < 0 || y > 1) return null;
    return { x, y };
  }

  // Pointer → tap / swipe
  let down = null;
  video.addEventListener("pointerdown", (e) => {
    down = normFromEvent(e);
    video.setPointerCapture(e.pointerId);
  });
  video.addEventListener("pointerup", (e) => {
    const up = normFromEvent(e);
    if (!down || !up) { down = null; return; }
    const dx = up.x - down.x, dy = up.y - down.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.02) {
      sendInput({ t: "tap", x: up.x, y: up.y });
    } else {
      sendInput({ t: "swipe", x1: down.x, y1: down.y, x2: up.x, y2: up.y, ms: 180 });
    }
    down = null;
  });

  // Nav buttons
  document.querySelectorAll("[data-nav]").forEach((b) =>
    b.addEventListener("click", () => sendInput({ t: b.getAttribute("data-nav") }))
  );

  // Connect / disconnect / fullscreen
  const idInput = el("hostId");
  idInput.addEventListener("input", () => { idInput.value = idInput.value.replace(/\D/g, ""); });
  el("connectBtn").addEventListener("click", () => {
    const id = idInput.value.trim();
    hostPassword = el("hostPw").value;
    if (id.length === 9) start(id);
    else setPill("Enter a 9-digit ID", "err");
  });
  idInput.addEventListener("keydown", (e) => { if (e.key === "Enter") el("connectBtn").click(); });
  el("disconnectBtn").addEventListener("click", fullDisconnect);
  el("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) stage.requestFullscreen?.();
    else document.exitFullscreen?.();
  });

  // ---- File browser ----
  function filesSend(obj) {
    if (filesDc && filesDc.readyState === "open") filesDc.send(JSON.stringify(obj));
  }
  function setFileStatus(t) { el("filesStatus").textContent = t || ""; }
  function fmtSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }
  function ls(path) { filesSend({ t: "ls", path: path || "" }); }

  function onFilesMessage(ev) {
    if (typeof ev.data === "string") {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === "ls_res") {
        if (m.error) { setFileStatus("Can't open folder"); return; }
        renderListing(m);
      } else if (m.t === "file_begin") {
        recv = { name: m.name, size: m.size || 0, chunks: [], got: 0 };
        setFileStatus("Downloading " + m.name + "…");
      } else if (m.t === "file_end") {
        finishDownload();
      } else if (m.t === "file_cancelled") {
        recv = null; setFileStatus("Cancelled");
      } else if (m.t === "error") {
        setFileStatus("Error: " + (m.error || "unknown"));
      }
    } else if (recv) {
      recv.chunks.push(ev.data);
      recv.got += ev.data.byteLength;
      const pct = recv.size ? Math.floor((recv.got / recv.size) * 100) : 0;
      setFileStatus("Downloading " + recv.name + " " + pct + "%");
    }
  }

  function finishDownload() {
    if (!recv) return;
    const blob = new Blob(recv.chunks);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = recv.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    setFileStatus("Saved " + recv.name);
    recv = null;
  }

  function joinPath(base, name) {
    return base.endsWith("/") ? base + name : base + "/" + name;
  }
  function parentPath(p) {
    if (!rootPath || p === rootPath) return rootPath;
    const i = p.lastIndexOf("/");
    const up = i > 0 ? p.substring(0, i) : rootPath;
    return up.length < rootPath.length ? rootPath : up;
  }

  function renderListing(m) {
    curPath = m.path || "";
    if (m.root) rootPath = m.root;
    el("filesPathLabel").textContent = curPath;
    const list = el("filesList");
    list.innerHTML = "";
    (m.entries || []).forEach((e) => {
      const li = document.createElement("li");
      const icon = document.createElement("span");
      icon.textContent = e.dir ? "📁" : "📄";
      const name = document.createElement("span");
      name.className = "fname"; name.textContent = e.name;
      li.appendChild(icon); li.appendChild(name);
      if (!e.dir) {
        const sz = document.createElement("span");
        sz.className = "fsize"; sz.textContent = fmtSize(e.size || 0);
        li.appendChild(sz);
      }
      li.addEventListener("click", () => {
        const child = joinPath(curPath, e.name);
        if (e.dir) ls(child);
        else { setFileStatus("Requesting " + e.name + "…"); filesSend({ t: "get", path: child }); }
      });
      list.appendChild(li);
    });
    if (!(m.entries || []).length) {
      const li = document.createElement("li");
      li.textContent = "(empty)"; li.style.color = "var(--muted)"; li.style.cursor = "default";
      list.appendChild(li);
    }
  }

  el("filesBtn").addEventListener("click", () => {
    el("filesPanel").classList.add("open");
    ls(""); // root
  });
  el("filesClose").addEventListener("click", () => el("filesPanel").classList.remove("open"));
  el("filesUp").addEventListener("click", () => ls(parentPath(curPath)));

  // Prefill from ?id=123456789
  const q = new URLSearchParams(location.search).get("id");
  if (q && /^\d{9}$/.test(q)) { idInput.value = q; }
})();
</script>
</body>
</html>
